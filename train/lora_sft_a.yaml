# Phase 4: LoRA SFT on reference solutions (training source A), Qwen2.5-Coder-3B 4-bit.
# Train: scripts/train_lora.sh train/lora_sft_a.yaml sft_a
model: mlx-community/Qwen2.5-Coder-3B-Instruct-4bit
train: true
data: data/sft_a
fine_tune_type: lora
optimizer: adamw
mask_prompt: true            # loss on the answer only, not the (long, repetitive) prompt
num_layers: 16               # top 16 of 36 layers
lora_parameters: {rank: 16, dropout: 0.0, scale: 20.0}
batch_size: 4
grad_accumulation_steps: 1
iters: 250                   # 1,000 examples (~125 per family, ~0.33 epoch); templated data converges fast
learning_rate: 2.0e-4
lr_schedule: {name: cosine_decay, warmup: 15, warmup_init: 1.0e-6, arguments: [2.0e-4, 250, 1.0e-6]}
max_seq_length: 1024         # longest example is 961 tokens
grad_checkpoint: false       # ~25-30% faster; set true if peak memory gets close to ~10 GB
steps_per_report: 10
steps_per_eval: 50
val_batches: 10
save_every: 50               # checkpoints every 50 steps (pick only by validation loss)
seed: 0
