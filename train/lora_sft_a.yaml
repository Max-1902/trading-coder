# Phase 4: LoRA SFT on reference solutions (training source A), Qwen2.5-Coder-3B 4-bit.
# Train: scripts/train_lora.sh train/lora_sft_a.yaml sft_a
model: mlx-community/Qwen2.5-Coder-3B-Instruct-4bit
train: true
data: data/sft_a
fine_tune_type: lora
optimizer: adamw
mask_prompt: true            # loss on the answer only, not the (long, repetitive) prompt
num_layers: 16               # top 16 of 36 layers
lora_parameters: {rank: 16, dropout: 0.0, scale: 20.0}
batch_size: 4
grad_accumulation_steps: 1
iters: 500                   # 2,000 examples ~ 0.65 epoch of 3,051; templated data converges fast
learning_rate: 1.0e-4
lr_schedule: {name: cosine_decay, warmup: 25, warmup_init: 1.0e-6, arguments: [1.0e-4, 500, 1.0e-6]}
max_seq_length: 1024         # longest example is 961 tokens
grad_checkpoint: true        # keeps memory low on 16 GB; set false if the timing run shows headroom
steps_per_report: 10
steps_per_eval: 100
val_batches: 10
save_every: 100              # checkpoints at 100..500 to pick from without retraining
seed: 0
